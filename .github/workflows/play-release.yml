name: Play Console — release

# 수동 실행 전용. Actions 탭 → "Play Console — release" → Run workflow.
#   action=internal : 빌드 → 내부 테스트 트랙 업로드 (release_notes 사용)
#   action=promote  : 재빌드 없이 내부 테스트 최신 버전을 프로덕션으로 승격
#                     (rollout 사용, 출시 노트는 내부 테스트 것 복사 — tool/play_promote.py)
# CLI: gh workflow run play-release.yml --ref main -f action=internal -f release_notes="..."
#      gh workflow run play-release.yml --ref main -f action=promote -f rollout=1
# 첫 업로드는 Play Console에서 직접 한 번 해야 API 자동화가 풀린다(Google 정책).
# 서비스 계정 권한: 테스트 트랙 출시 + 프로덕션 출시 (2026-09-26).
#
# Required Secrets (Settings → Secrets and variables → Actions):
#   ENV_JSON_BASE64            — .env.json 전체를 base64로
#   UPLOAD_KEYSTORE_BASE64     — android/app/upload-keystore.jks 를 base64로
#   KEYSTORE_STORE_PASSWORD    — key.properties 의 storePassword
#   KEYSTORE_KEY_PASSWORD      — key.properties 의 keyPassword
#   KEYSTORE_KEY_ALIAS         — key.properties 의 keyAlias (예: upload)
#   KAKAO_NATIVE_APP_KEY       — local.properties 의 kakao.nativeAppKey
#   PLAY_SERVICE_ACCOUNT_JSON  — Play Console Service Account JSON 통째로
#
# 셋업 가이드: docs/ops/play-release-setup.md

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'internal = 빌드해서 내부 테스트 업로드 / promote = 내부 테스트 최신 버전을 프로덕션으로 승격(재빌드 없음)'
        required: true
        type: choice
        options:
          - internal
          - promote
        default: internal
      release_notes:
        description: '[internal] 릴리스 노트 (한국어) — Play Console 변경사항에 그대로 표시됨'
        required: false
        type: string
        default: '내부 테스트 빌드.'
      rollout:
        description: '[promote] 프로덕션 출시 비율 0~1 (1 = 전체, 0.2 = 20% 단계적). 같은 버전으로 다시 실행하면 비율만 올림'
        required: false
        type: string
        default: '1'

jobs:
  build-and-upload:
    if: inputs.action == 'internal'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode .env.json
        env:
          ENV_JSON_BASE64: ${{ secrets.ENV_JSON_BASE64 }}
        run: |
          echo "$ENV_JSON_BASE64" | base64 -d > .env.json
          test -s .env.json

      - name: Decode upload-keystore.jks
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

      - name: Write android/key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Write android/local.properties (kakao key)
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          echo "kakao.nativeAppKey=${KAKAO_KEY}" > android/local.properties

      - name: flutter pub get
        run: flutter pub get

      # 골든(카드 스냅샷)은 로컬 Windows에서 만든 이미지라 ubuntu 글리프 렌더링과
      # 픽셀이 달라 제외 — 로컬 `flutter test`에서만 비교(dart_test.yaml 참고).
      - name: flutter test
        run: flutter test --exclude-tags golden

      - name: Build app bundle (release)
        run: flutter build appbundle --release --dart-define-from-file=.env.json

      - name: Write release notes (ko-KR)
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p distribution/whatsnew
          # Play Console "변경사항" 한도: 500자. 넘으면 action이 알아서 자름.
          printf '%s' "$NOTES" > distribution/whatsnew/whatsnew-ko-KR

      - name: Upload to Play Console (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.tgparkk.bookquote
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Summary
        run: |
          echo "## ✅ Internal upload complete" >> $GITHUB_STEP_SUMMARY
          echo "- packageName: io.github.tgparkk.bookquote" >> $GITHUB_STEP_SUMMARY
          echo "- track: internal" >> $GITHUB_STEP_SUMMARY
          echo "- AAB: build/app/outputs/bundle/release/app-release.aab" >> $GITHUB_STEP_SUMMARY

  # 내부 테스트에서 확인한 바로 그 AAB(versionCode)를 프로덕션으로 — 재빌드·재업로드 없음.
  promote:
    if: inputs.action == 'promote'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google API client
        run: pip install google-api-python-client google-auth

      - name: Promote internal → production
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ROLLOUT: ${{ inputs.rollout }}
        # shell: bash를 명시해야 -o pipefail이 켜진다(기본 셸은 bash -e만 — `| tee`가
        # 스크립트 실패를 삼켜 403인데도 success로 끝났던 2026-09-26 버그).
        shell: bash
        run: python tool/play_promote.py 2>&1 | tee promote.log

      - name: Summary
        run: |
          echo "## 🚀 Production promote" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat promote.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
